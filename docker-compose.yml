services:
  app:
    container_name: maya-spirulina-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "${PORT:-3000}:3000"
    # SMS, Telegram, SMTP, payment and cron settings come from .env
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-maya_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-maya_spirulina_db}?schema=public
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    networks:
      - maya-network

  # Applies database migrations and the idempotent seed (roles, settings,
  # notification templates, first super admin) before the app starts.
  migrate:
    container_name: maya-spirulina-migrate
    build:
      context: .
      dockerfile: Dockerfile
      target: builder
    command: sh -c "npx prisma migrate deploy && npx prisma db seed"
    env_file: .env
    environment:
      - NODE_ENV=production
      - DATABASE_URL=postgresql://${POSTGRES_USER:-maya_admin}:${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}@postgres:5432/${POSTGRES_DB:-maya_spirulina_db}?schema=public
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - maya-network

  postgres:
    container_name: maya-spirulina-postgres
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-maya_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      POSTGRES_DB: ${POSTGRES_DB:-maya_spirulina_db}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-maya_admin} -d ${POSTGRES_DB:-maya_spirulina_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maya-network

  redis:
    container_name: maya-spirulina-redis
    image: redis:7-alpine
    restart: always
    ports:
      - "${REDIS_PORT:-6380}:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - maya-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  maya-network:
    driver: bridge
